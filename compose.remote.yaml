services:
  postgres:
    ports: !reset []

  api:
    image: hackalem-api:deploy
    ports: !reset []
    environment:
      NODE_ENV: production

  web:
    image: hackalem-web:deploy
    ports: !reset []

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-3001}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
